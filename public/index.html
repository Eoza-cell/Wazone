<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Wazone Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="connection-container">
        <h1>Wazone Bot</h1>
        <div id="pairing-form">
            <p>Entrez votre numéro de téléphone (avec l'indicatif pays, sans le '+') pour recevoir un code d'appairage.</p>
            <input type="text" id="phone-number" placeholder="Ex: 33612345678">
            <button id="get-code-button">Obtenir le code</button>
        </div>
        <div id="pairing-code-display" class="hidden">
            <p>Ouvrez WhatsApp sur votre téléphone, allez dans `Appareils connectés > Connecter un appareil` et entrez le code suivant :</p>
            <div id="pairing-code"></div>
        </div>
        <p class="status-text">En attente de connexion...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
