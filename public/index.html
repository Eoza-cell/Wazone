<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEOX // Interface de Liaison</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="connection-container">
        <div class="logo-container">
            <span class="glitch" data-text="NEOX">NEOX</span>
        </div>
        <p class="subtitle">LIAISON NEOVERSE EN COURS</p>
        <p>Saisissez ce code de jumelage sur votre terminal mobile :</p>
        <div id="pairing-code-container">
            <p id="pairing-code">En attente du code...</p>
        </div>
        <p class="status-text">Demande d'un code de jumelage au serveur...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
