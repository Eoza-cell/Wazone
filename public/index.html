<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Wazone Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="connection-container">
        <h1>Wazone Bot</h1>
        <div id="form-container">
            <p>Entrez votre numéro de téléphone WhatsApp (avec l'indicatif pays, sans le '+') :</p>
            <input type="text" id="phone-number" placeholder="Ex: 33612345678">
            <button id="connect-button">Générer le code</button>
        </div>
        <div id="code-container" style="display: none;">
            <p>Allez dans les <strong>Appareils connectés</strong> de WhatsApp, sélectionnez <strong>"Connecter avec le numéro de téléphone"</strong> et entrez ce code :</p>
            <p id="pairing-code" class="code-display">En attente du code...</p>
        </div>
        <p class="status-text"></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
