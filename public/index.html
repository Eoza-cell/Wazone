<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Wazone Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="connection-container">
        <h1>Wazone Bot</h1>
        <p>Scannez le QR Code avec votre téléphone :</p>
        <div id="qr-container">
            <img id="qr-image" src="" alt="QR Code" style="display: none; max-width: 300px;">
            <p id="pairing-code">En attente du QR Code...</p>
        </div>
        <p class="status-text">Demande du QR Code au serveur...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
